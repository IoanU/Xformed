name: Build and deploy Xformed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-xformed-wasm-${{ hashFiles('Cargo.lock', 'scripts/build-web.mjs') }}
          restore-keys: ${{ runner.os }}-xformed-wasm-
      - name: Native regression tests
        run: cargo test --locked --workspace
      - name: Build static studio
        run: node scripts/build-web.mjs
      - name: Test WebAssembly worker
        run: node scripts/wasm-smoke.mjs
      - name: Test ZIP exports
        run: node scripts/zip-test.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
